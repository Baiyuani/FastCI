name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="fastci_${version}_${os}_${arch}"
            dir="dist/${name}"
            mkdir -p "$dir"
            bin="fastci"
            [ "$os" = windows ] && bin="fastci.exe"
            GOOS="$os" GOARCH="$arch" go build \
              -ldflags "-s -w -X github.com/Baiyuani/FastCI/internal/cli.Version=${version}" \
              -o "${dir}/${bin}" ./cmd/fastci
            cp LICENSE "${dir}/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "${name}.zip" "${name}")
            else
              tar -czf "dist/${name}.tar.gz" -C dist "${name}"
            fi
          done
          (cd dist && sha256sum fastci_*.tar.gz fastci_*.zip > checksums.txt)

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fastci_*.tar.gz
            dist/fastci_*.zip
            dist/checksums.txt
